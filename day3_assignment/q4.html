<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User List</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }
      table,
      th,
      td {
        border: 1px solid #ddd;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .loading {
        font-size: 20px;
        font-weight: bold;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 2s linear infinite;
        display: none;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <h2>User List</h2>

    <div id="loading" class="loading">Loading...</div>

    <input
      type="text"
      id="searchInput"
      placeholder="Search by name..."
      style="margin-bottom: 10px; padding: 8px; font-size: 16px"
    />

    <button id="sortButton" style="padding: 10px; font-size: 16px">
      Sort by Name
    </button>

    <table id="userTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Avatar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="spinner" class="spinner"></div>

    <script>
      const apiUrl = "https://reqres.in/api/users";
      let users = []; // Global array to store users

      async function fetchUsers() {
        document.getElementById("spinner").style.display = "block";
        document.getElementById("loading").style.display = "none";

        try {
          const response = await fetch(apiUrl);
          if (!response.ok)
            throw new Error(`HTTP error! Status: ${response.status}`);

          const data = await response.json();
          users = data.data;

          insertUserIntoTable(users);
        } catch (error) {
          console.error("Error fetching users:", error);
          document.getElementById("loading").textContent =
            "Error loading data!";
        } finally {
          document.getElementById("spinner").style.display = "none";
        }
      }

      function insertUserIntoTable(usersList) {
        const tableBody = document
          .getElementById("userTable")
          .getElementsByTagName("tbody")[0];
        tableBody.innerHTML = "";

        usersList.forEach((user) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${user.first_name} ${user.last_name}</td>
            <td>${user.email}</td>
            <td><img src="${user.avatar}" alt="Avatar" width="50" height="50"></td>
          `;
          tableBody.appendChild(row);
        });
      }

      function sortByName() {
        users.sort((a, b) => a.first_name.localeCompare(b.first_name));
        insertUserIntoTable(users);
      }

      function filterTable() {
        const filter = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filteredUsers = users.filter((user) =>
          (user.first_name + " " + user.last_name)
            .toLowerCase()
            .includes(filter)
        );
        insertUserIntoTable(filteredUsers);
      }

      window.onload = function () {
        fetchUsers();
        document
          .getElementById("searchInput")
          .addEventListener("input", filterTable);
        document
          .getElementById("sortButton")
          .addEventListener("click", sortByName);
      };
    </script>
  </body>
</html>
